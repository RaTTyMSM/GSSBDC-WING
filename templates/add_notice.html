{% extends "base.html" %}
{% block title %}Add Notice — GSSBDC WING{% endblock %}
{% block content %}
<h2>Add Notice</h2>
    <a href="{{ url_for('notices_list') }}">&larr; Back to Notices</a>
    <hr>

    {% if error %}
        <div class="flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Message:</label><br>
        <textarea name="message" rows="5" cols="40" required></textarea><br><br>

        <label>Priority:</label><br>
        <select name="priority">
            <option value="Normal">Normal</option>
            <option value="Important">Important</option>
            <option value="Emergency">Emergency</option>
        </select><br><br>

        <label>Audience:</label><br>
        <select name="audience">
            <option value="all">All members</option>
            <option value="executives">Executives only</option>
        </select>
        <p class="muted" style="margin-top:4px;font-size:.85rem;">
            “Executives only” is visible to Executive, Admin &amp; Watcher — not General members.
        </p>
        <br>

        <button type="submit">Post Notice</button>
    </form>
{% endblock %}
