<!DOCTYPE html>
<html>
<head>
    <title>Edit Notice</title>
</head>
<body>
    <h2>Edit Notice</h2>
    <a href="{{ url_for('notices_list') }}">&larr; Back to Notices</a>
    | <a href="{{ url_for('logout') }}">Logout</a>
    <hr>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Title:</label><br>
        <input type="text" name="title" value="{{ notice.title }}" required><br><br>

        <label>Message:</label><br>
        <textarea name="message" rows="5" cols="40" required>{{ notice.message }}</textarea><br><br>

        <label>Priority:</label><br>
        <select name="priority">
            <option value="Normal" {% if notice.priority == "Normal" %}selected{% endif %}>Normal</option>
            <option value="Important" {% if notice.priority == "Important" %}selected{% endif %}>Important</option>
            <option value="Emergency" {% if notice.priority == "Emergency" %}selected{% endif %}>Emergency</option>
        </select><br><br>

        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
