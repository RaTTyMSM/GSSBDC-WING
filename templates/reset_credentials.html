<!DOCTYPE html>
<html>
<head>
    <title>Reset Credentials</title>
</head>
<body>
    <h2>Reset Login Credentials — {{ member.name }}</h2>
    <a href="{{ url_for('members_list') }}">&larr; Back to Members</a>
    | <a href="{{ url_for('logout') }}">Logout</a>
    <hr>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Username:</label><br>
        <input type="text" name="username" value="{{ member.username }}" required><br><br>

        <label>New Password:</label><br>
        <input type="password" name="password" required minlength="4"><br><br>

        <button type="submit">Update Credentials</button>
    </form>
</body>
</html>
